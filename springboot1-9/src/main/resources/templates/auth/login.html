<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>IOTSTAR SHOP</h1>
        <h2>Đăng nhập</h2>
        
        <div class="alert error" th:if="${param.error}">
            Username/email hoặc password không đúng
        </div>
        
        <div class="alert success" th:if="${param.logout}">
            Bạn đã đăng xuất
        </div>
        
        <form th:action="@{/login}" method="post">
            <label>Email hoặc Username</label>
            <input type="text" name="username" placeholder="Username hoặc email" required autofocus>
            
            <label>Mật khẩu</label>
            <input type="password" name="password" placeholder="Password" required>
            
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn primary full mt" type="submit">Đăng nhập</button>
        </form>
        <p class="mt" style="text-align: center;">
            <a th:href="@{/register}">Tạo tài khoản</a> · <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
        </p>
    </div>
</body>
</html>
